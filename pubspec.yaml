name: almohafez
description: "المحفظ — تعلّم التجويد واحفظ القرآن الكريم وتفقّه في دينك"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.9.40
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C1A16"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
  fonts:
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
