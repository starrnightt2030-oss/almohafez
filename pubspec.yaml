name: almohafez
description: "سَنَد — معلّمك الشخصي للقرآن الكريم: احفظ مع الشيخ وأتقن التجويد وتفقّه في دينك"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ^0.9.40
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.2
  share_plus: ^10.1.0
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0
  flutter_tts: ^4.2.0
  confetti: ^0.8.0
  http: ^1.2.2
  open_filex: ^4.5.0
  sherpa_onnx: ^2.0.0
  record: ^6.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/brand/
    - assets/audio/lessons/
    - assets/audio/voice/
    - assets/audio/quiz/
    - assets/audio/hadith/
  fonts:
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro-400.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-500.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-600.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-700.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
