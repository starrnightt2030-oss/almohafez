name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter --version
          flutter create --org com.almohafez --project-name almohafez --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Dependencies and icon
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk almohafez.apk

      - uses: actions/upload-artifact@v4
        with:
          name: almohafez-apk
          path: almohafez.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: المحفظ — نسخة ${{ github.run_number }}
          body: نسخة تجريبية من تطبيق المحفظ. نزّل ملف almohafez.apk وثبّته على موبايلك.
          files: almohafez.apk
          make_latest: true
