name: Transcribe voice recordings

# يفرّغ تسجيلات الصوت (Whisper بتوقيت كل كلمة) عشان نقطّعها على المقاطع بدقة.
# الملفات على فرع audio-work، والنتيجة بتترفع على نفس الفرع.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio-work
      - name: Setup
        run: |
          pip install -q faster-whisper
          sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: Transcribe
        run: |
          python3 - <<'PY'
          import json, glob, time
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8", cpu_threads=4)
          for f in sorted(glob.glob('part*.mp3')):
              out = f.replace('.mp3', '.words.json')
              t = time.time()
              segs, info = m.transcribe(f, language="ar", word_timestamps=True, beam_size=1, vad_filter=False, condition_on_previous_text=False)
              words = []
              for s in segs:
                  for w in (s.words or []):
                      words.append([round(w.start, 2), round(w.end, 2), w.word.strip()])
              json.dump(words, open(out, 'w'), ensure_ascii=False)
              print(f, len(words), 'words', round(time.time() - t), 's', ' '.join(w[2] for w in words[:25]), flush=True)
          PY
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.words.json
          git commit -m "transcripts"
          git push
